[project]
name = "cluster-manager"
version = "0.1.0"
description = "SSH-based manager for uv and GPU Docker workloads on compute nodes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clusterctl = "cluster_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_manager"]

